[package]
name = "ferrum-physics"
version = "0.1.0"
edition = "2024"
authors = ["Oleg Pavlenko"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/olejaaaaaaaa/ferrum/crates/ferrum-physics"

[dependencies]
rapier2d = { version = "0.29.0", features = [ "simd-stable" ], optional = true }
physx = { version = "0.19.0", optional = true }
physx-sys = { version = "0.11.5", optional = true }

[features]
default = ["rapier"]
physx = ["dep:physx", "dep:physx-sys"]
rapier = ["dep:rapier2d"]