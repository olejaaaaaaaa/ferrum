[package]
name = "ferrum-render"
version = "0.1.0"
edition = "2024"
authors = ["Oleg Pavlenko"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/olejaaaaaaaa/ferrum/crates/ferrum-render"
build = "build.rs"
keywords = [
    "graphics",
    "gpu",
    "vulkan"
]

[dependencies]
ash = { version = "0.38.0",  features = ["debug", "std"] }
ash-window = "0.13.0"
winit = { version = "0.29", features = ["rwh_06"] }
log = "0.4"
env_logger = { version = "0.11.8", features = ["color"] }
cfg-if = { version = "1" }
vk-mem = { version = "0.5.0", optional = true }
thiserror = "2.0.15"
gpu-allocator = { version = "0.27.0", features = ["vulkan"], optional = true}
image = { version = "0.25.6", features = ["png", "jpeg"] }

[features]
default = ["vma"]
vma = ["dep:vk-mem"]
gpu-allocator = ["dep:gpu-allocator"]
dlss = []
fsr1 = []
fsr2 = []
